name: TikTok Streak

on:
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Kiểm tra người nhận hoặc gửi tin'
        type: choice
        default: dry-run
        options:
          - dry-run
          - send

permissions:
  contents: write

concurrency:
  group: tiktok-streak
  cancel-in-progress: false

jobs:
  streak:
    if: github.event_name == 'workflow_dispatch' || vars.BOT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run bot
        env:
          COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
          RECIPIENTS_JSON: ${{ secrets.RECIPIENTS_JSON }}
          ACCOUNT_USERNAME: ${{ secrets.ACCOUNT_USERNAME }}
          MESSAGE: ${{ vars.MESSAGE }}
          BOT_ENABLED: ${{ vars.BOT_ENABLED || 'false' }}
          BOT_MODE: ${{ inputs.mode || 'send' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$BOT_MODE" = "dry-run" ]; then
            npm run dry-run
          else
            npm start
          fi
