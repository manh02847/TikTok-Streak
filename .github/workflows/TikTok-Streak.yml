name: TikTok Streak
run-name: ${{ github.event_name == 'schedule' && 'Tự động · kiểm tra khung gửi' || format('Chạy tay · {0}', inputs.mode) }}

on:
  schedule:
    - cron: '17 1-10,13-15 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Kiểm tra cấu hình, người nhận hoặc gửi tin'
        type: choice
        default: dry-run
        options:
          - dry-run
          - check-config
          - send

permissions:
  contents: write

concurrency:
  group: tiktok-streak
  cancel-in-progress: false

jobs:
  streak:
    if: github.event_name == 'workflow_dispatch' || vars.BOT_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Check schedule before installing browser
        id: schedule
        if: github.event_name == 'schedule'
        env:
          ACCOUNT_USERNAME: ${{ secrets.ACCOUNT_USERNAME }}
          RECIPIENTS_JSON: ${{ secrets.RECIPIENTS_JSON }}
          BOT_ENABLED: ${{ vars.BOT_ENABLED || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node check-schedule.js
      - run: npm ci
        if: github.event_name != 'schedule' || steps.schedule.outputs.proceed == 'true'
      - name: Check configuration
        if: github.event_name != 'schedule' || steps.schedule.outputs.proceed == 'true'
        env:
          COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
          RECIPIENTS_JSON: ${{ secrets.RECIPIENTS_JSON }}
          ACCOUNT_USERNAME: ${{ secrets.ACCOUNT_USERNAME }}
          MESSAGE: ${{ vars.MESSAGE }}
          MESSAGES_JSON: ${{ vars.MESSAGES_JSON }}
          BOT_ENABLED: ${{ vars.BOT_ENABLED || 'false' }}
        run: npm run check-config
      - run: npx playwright install --with-deps chromium
        if: inputs.mode != 'check-config' && (github.event_name != 'schedule' || steps.schedule.outputs.proceed == 'true')
      - name: Run bot
        if: inputs.mode != 'check-config' && (github.event_name != 'schedule' || steps.schedule.outputs.proceed == 'true')
        env:
          COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
          RECIPIENTS_JSON: ${{ secrets.RECIPIENTS_JSON }}
          ACCOUNT_USERNAME: ${{ secrets.ACCOUNT_USERNAME }}
          MESSAGE: ${{ vars.MESSAGE }}
          MESSAGES_JSON: ${{ vars.MESSAGES_JSON }}
          BOT_ENABLED: ${{ vars.BOT_ENABLED || 'false' }}
          BOT_MODE: ${{ inputs.mode || 'send' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$BOT_MODE" = "dry-run" ]; then
            npm run dry-run
          else
            npm start
          fi
